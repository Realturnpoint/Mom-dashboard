<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GTA V — Interactive Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --gold: #f6c90e;
      --bg: #0d0d0d;
      --bg2: #161616;
      --bg3: #1e1e1e;
      --border: #2e2e2e;
      --text: #e4e4e4;
      --text-muted: #888;
      --sidebar-w: 330px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      display: flex;
      height: 100vh;
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    /* ── SIDEBAR ─────────────────────────────────────── */
    #sidebar {
      width: var(--sidebar-w);
      min-width: var(--sidebar-w);
      display: flex;
      flex-direction: column;
      background: var(--bg2);
      border-right: 1px solid var(--border);
      z-index: 1000;
      overflow: hidden;
    }

    #sidebar-header {
      padding: 14px 16px 12px;
      background: var(--bg3);
      border-bottom: 2px solid var(--gold);
      flex-shrink: 0;
    }

    #sidebar-header h1 {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--gold);
      line-height: 1;
    }

    #sidebar-header p {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 3px;
    }

    input[type="text"] {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 5px;
      color: var(--text);
      font-size: 13px;
      padding: 7px 9px;
      width: 100%;
      outline: none;
      transition: border-color 0.15s;
      font-family: inherit;
    }

    input:focus {
      border-color: var(--gold);
    }

    .btn {
      padding: 8px 14px;
      border-radius: 5px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      border: none;
      cursor: pointer;
      transition: filter 0.15s, transform 0.1s;
    }

    .btn:active { transform: scale(0.97); }
    .btn:hover { filter: brightness(1.15); }

    .btn-primary { background: var(--gold); color: #111; width: 100%; }
    .btn-sm      { padding: 5px 10px; font-size: 10px; }
    .btn-ghost   { background: var(--bg3); color: var(--text-muted); border: 1px solid var(--border); }

    /* ── PIN LIST ─────────────────────────────────────── */
    #panel-pins {
      display: flex;
      flex: 1;
      flex-direction: column;
      overflow-y: auto;
      padding: 10px;
      gap: 6px;
    }

    #search-bar {
      position: relative;
      flex-shrink: 0;
    }

    #search-input {
      padding-left: 30px;
      width: 100%;
    }

    .search-icon {
      position: absolute;
      left: 9px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 13px;
      pointer-events: none;
    }

    #filter-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }

    .filter-chip {
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 99px;
      border: 1px solid var(--border);
      background: var(--bg3);
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.12s;
    }

    .filter-chip.active {
      border-color: var(--gold);
      color: var(--gold);
      background: rgba(246,201,14,0.1);
    }

    #pin-list {
      display: flex;
      flex-direction: column;
      gap: 5px;
      overflow-y: auto;
      flex: 1;
    }

    #pin-count {
      font-size: 10px;
      color: var(--text-muted);
      text-align: right;
      flex-shrink: 0;
    }

    .pin-card {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 9px 10px;
      cursor: pointer;
      transition: border-color 0.12s, background 0.12s;
      display: flex;
      align-items: flex-start;
      gap: 9px;
    }

    .pin-card:hover { border-color: #444; background: #242424; }
    .pin-card.highlighted { border-color: var(--gold); background: rgba(246,201,14,0.06); }

    .pin-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
      margin-top: 3px;
    }

    .pin-card-body { flex: 1; min-width: 0; }

    .pin-card-name {
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pin-card-meta {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .pin-card-notes {
      font-size: 10px;
      color: #999;
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── MAP AREA ─────────────────────────────────────── */
    #map-wrap {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: #0a0a0a;
    }

    #map {
      width: 100%;
      height: 100%;
      background: #111;
    }

    /* grid background for when no image is loaded */
    .leaflet-container {
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 49px,
        #1a1a1a 49px,
        #1a1a1a 50px
      ),
      repeating-linear-gradient(
        90deg,
        transparent,
        transparent 49px,
        #1a1a1a 49px,
        #1a1a1a 50px
      ),
      #0d0d0d;
    }

    /* map status bar */
    #map-statusbar {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.75);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 5px 12px;
      font-size: 11px;
      color: var(--text-muted);
      pointer-events: none;
      z-index: 500;
      backdrop-filter: blur(4px);
      white-space: nowrap;
    }

    #map-statusbar span { color: var(--gold); font-family: monospace; font-weight: 600; }

    /* no-map overlay */
    #no-map-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      pointer-events: none;
      z-index: 400;
    }

    #no-map-overlay h2 { font-size: 14px; color: var(--gold); margin-bottom: 6px; }
    #no-map-overlay p  { font-size: 12px; color: var(--text-muted); line-height: 1.6; max-width: 260px; }

    /* ── LEAFLET OVERRIDES ────────────────────────────── */
    .leaflet-popup-content-wrapper {
      background: var(--bg3);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 7px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }

    .leaflet-popup-tip { background: var(--bg3); }

    .leaflet-popup-content { margin: 10px 12px; }

    .popup-title {
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 3px;
    }

    .popup-cat {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 5px;
    }

    .popup-coords {
      font-size: 11px;
      color: var(--text-muted);
      font-family: monospace;
    }

    .popup-notes {
      font-size: 11px;
      color: #bbb;
      margin-top: 5px;
      border-top: 1px solid var(--border);
      padding-top: 5px;
      word-break: break-word;
    }

    .popup-actions {
      display: flex;
      gap: 5px;
      margin-top: 8px;
    }

    #recipe-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 2000;
      align-items: center;
      justify-content: center;
    }

    #recipe-overlay.show { display: flex; }

    #recipe-modal {
      width: min(720px, 92vw);
      max-height: 88vh;
      overflow: auto;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-top: 2px solid var(--gold);
      border-radius: 8px;
      padding: 18px;
    }

    #recipe-modal h2 { font-size: 15px; color: var(--gold); }
    #recipe-modal p { margin-top: 4px; font-size: 11px; color: var(--text-muted); }

    #recipe-grid {
      display: grid;
      grid-template-columns: repeat(8, minmax(80px, 1fr));
      gap: 8px;
      margin: 16px 0 10px;
    }

    .recipe-cell {
      min-width: 0;
      min-height: 62px;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font: 600 10px/1.1 inherit;
      padding: 6px 4px;
      text-align: center;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: normal;
      cursor: pointer;
    }

    .recipe-cell:hover { border-color: var(--gold); }
    .recipe-cell::placeholder { color: #666; }
    .recipe-cell:focus { border-color: var(--gold); outline: none; }

    .recipe-detail {
      background: rgba(246,201,14,0.06);
      border: 1px solid rgba(246,201,14,0.35);
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .recipe-detail.hidden { display: none; }

    .recipe-detail h3 {
      font-size: 13px;
      color: var(--gold);
      margin-bottom: 6px;
    }

    .recipe-detail p {
      color: var(--text-muted);
      font-size: 11px;
      margin-bottom: 8px;
    }

    #recipe-detail-ingredients,
    #recipe-detail-steps {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 0;
      padding: 0;
    }

    #recipe-detail-ingredients li,
    #recipe-detail-steps li {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px 8px;
      font-size: 10px;
      color: var(--text);
    }

    #recipe-detail-steps {
      display: block;
      margin-top: 8px;
      list-style: decimal inside;
    }

    #recipe-detail-steps li {
      border-radius: 4px;
      padding: 5px 8px;
      margin-bottom: 4px;
      list-style-position: inside;
      display: list-item;
    }

    #recipe-actions { display: flex; justify-content: flex-end; gap: 8px; }

    /* ── SCROLLBAR ────────────────────────────────────── */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 99px; }
    ::-webkit-scrollbar-thumb:hover { background: #555; }
  </style>
</head>
<body>

<!-- ═══════════════════════ SIDEBAR ════════════════════════ -->
<div id="sidebar">
  <div id="sidebar-header">
    <h1>GTA V — Database Pins</h1>
    <p id="sidebar-subtitle">Pins loaded from your database</p>
  </div>

  <div id="panel-pins">
    <div id="search-bar">
      <span class="search-icon">🔍</span>
      <input type="text" id="search-input" placeholder="Search pins…" />
    </div>

    <div id="filter-row">
      <span class="filter-chip active" data-cat="all" title="All pins">•</span>
    </div>

    <div id="pin-count">0 pins</div>
    <div id="pin-list"></div>
  </div>

</div>

<!-- ═══════════════════════ MAP ════════════════════════ -->
<div id="map-wrap">
  <div id="map"></div>

  <div id="no-map-overlay">
    <h2>No Map Image Loaded</h2>
    <p>The GTA map image could not be loaded.</p>
  </div>

  <div id="map-statusbar">
    Cursor: <span id="status-coords">—</span>
  </div>
</div>

<div id="recipe-overlay">
  <div id="recipe-modal" role="dialog" aria-modal="true" aria-labelledby="recipe-title">
    <h2 id="recipe-title">Crafting Recipes</h2>
    <p>5 rows × 8 slots</p>
    <div id="recipe-grid"></div>
    <div id="recipe-detail" class="recipe-detail hidden">
      <h3 id="recipe-detail-title">Item</h3>
      <p id="recipe-detail-summary">Select an item to see how it is made.</p>
      <ul id="recipe-detail-ingredients"></ul>
      <ol id="recipe-detail-steps"></ol>
    </div>
    <div id="recipe-actions">
      <button class="btn btn-ghost" id="recipe-cancel">Close</button>
      <button class="btn btn-primary" id="recipe-save">Save Recipes</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="./pins.js"></script>
<script src="./crafting-recipes.js"></script>
<script>
'use strict';

// ─── Config ──────────────────────────────────────────────────────
const RECIPES_KEY  = 'gtav_pin_recipes_v1';

const CATEGORY_COLORS = {
  general:    '#f6c90e',
  Crafting:   '#8bc34a',
  Onderwereld:'#e04444',
  vehicle:    '#4da6ff',
  money:      '#4caf50',
  collectible:'#ff9800',
  property:   '#ce93d8',
  mission:    '#4dd0e1',
  other:      '#9e9e9e',
};

const CATEGORY_LABELS = {
  general:    '📍 General',
  Crafting:   '🛠️ Crafting',
  Onderwereld: '🔫 Onderwereld',
  vehicle:    '🚗 Vehicle',
  money:      '💰 Money / Stash',
  collectible:'⭐ Collectible',
  property:   '🏠 Property / Building',
  mission:    '📋 Mission Point',
  other:      '🔖 Other',
};

const CATEGORY_ICONS = {
  general: '📍',
  crafting: '🛠️',
  onderwereld: '🔫',
  vehicle: '🚗',
  money: '💰',
  collectible: '⭐',
  property: '🏠',
  mission: '📋',
  other: '🔖',
};

const EXCLUDED_PIN_CATEGORIES = new Set([
  'other',
  'mission',
  'property',
  'property/house',
  'house',
]);

// ─── State ───────────────────────────────────────────────────────
let pins        = [];
let markerMap   = new Map();   // pinId → Leaflet marker
let activeFilter= 'all';
let searchQuery = '';
let imageLayer  = null;
let highlightedPinId = null;
let recipePinId = null;

const defaultMapUrl = './images/map-highres.png';
const mapBounds = [[-4000, -4000], [8000, 4500]];

// ─── Map init ────────────────────────────────────────────────────
const map = L.map('map', {
  crs:      L.CRS.Simple,
  minZoom:  -3,
  maxZoom:   0,
  zoomSnap:  0.5,
  attributionControl: false,
});

function applyMapBounds() {
  map.setMaxBounds(L.latLngBounds(mapBounds).pad(0.5));
  map.fitBounds(mapBounds);
  map.setView([0, 0], -2.5);
}

applyMapBounds();

// ─── Map image layer ─────────────────────────────────────────────
function loadMapImage() {
  if (imageLayer) { map.removeLayer(imageLayer); imageLayer = null; }
  const resolvedUrl = new URL(defaultMapUrl, window.location.href).href;
  imageLayer = L.imageOverlay(resolvedUrl, mapBounds, {
    opacity: 1,
    errorOverlayUrl: '',
  }).addTo(map);

  imageLayer.on('load', () => {
    document.getElementById('no-map-overlay').style.display = 'none';
  });
  imageLayer.on('error', () => {
    imageLayer = null;
    document.getElementById('no-map-overlay').style.display = '';
    alert('Could not load that image URL. Check the URL and that the server allows cross-origin requests.');
  });
}

loadMapImage();

// ─── Coordinate live readout ──────────────────────────────────────
map.on('mousemove', (e) => {
  const x = Math.round(e.latlng.lng);
  const y = Math.round(e.latlng.lat);
  document.getElementById('status-coords').textContent = `X: ${x}  Y: ${y}`;
});

// ─── Click to fill coords ─────────────────────────────────────────
map.on('click', async (e) => {
  const x = Math.round(e.latlng.lng);
  const y = Math.round(e.latlng.lat);
  const coordinates = `X: ${x}, Y: ${y}`;
  const status = document.getElementById('status-coords');

  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(coordinates);
    } else {
      const copyTarget = document.createElement('textarea');
      copyTarget.value = coordinates;
      copyTarget.style.position = 'fixed';
      copyTarget.style.opacity = '0';
      document.body.appendChild(copyTarget);
      copyTarget.select();
      if (!document.execCommand('copy')) throw new Error('Copy command failed');
      copyTarget.remove();
    }
    status.textContent = `${coordinates} — Copied`;
  } catch (error) {
    status.textContent = `${coordinates} — Copy failed`;
    console.error('Could not copy coordinates:', error);
  }
});

// ─── Pin icons ───────────────────────────────────────────────────
function createMarkerIcon(category) {
  const color = CATEGORY_COLORS[category] || CATEGORY_COLORS.general;
  const svg = `
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="32" viewBox="0 0 24 32">
      <path d="M12 0C5.373 0 0 5.373 0 12c0 9 12 20 12 20S24 21 24 12C24 5.373 18.627 0 12 0z"
            fill="${color}" stroke="#111" stroke-width="1.5"/>
      <circle cx="12" cy="12" r="4" fill="#111" fill-opacity="0.7"/>
    </svg>`;
  return L.divIcon({
    html: svg,
    className: '',
    iconSize:   [24, 32],
    iconAnchor: [12, 32],
    popupAnchor:[0, -34],
  });
}

function loadPins() {
  const sourcePins = Array.isArray(window.GTA_MAP_PINS) ? window.GTA_MAP_PINS : [];
  pins = sourcePins.filter(pin => !EXCLUDED_PIN_CATEGORIES.has(normalizeCategory(pin.category)));
  renderCategoryFilters();
}

function normalizeCategory(category) {
  return String(category || 'general').trim().toLowerCase();
}

function getCategoryLabel(category) {
  return CATEGORY_LABELS[category] || `${CATEGORY_ICONS[normalizeCategory(category)] || '📍'} ${category}`;
}

function renderCategoryFilters() {
  const filterRow = document.getElementById('filter-row');
  const categories = [...new Set(pins.map(pin => pin.category).filter(Boolean))];

  filterRow.innerHTML = '<span class="filter-chip active" data-cat="all" title="All pins">•</span>';
  categories.forEach(category => {
    const chip = document.createElement('span');
    const normalizedCategory = normalizeCategory(category);
    chip.className = 'filter-chip';
    chip.dataset.cat = category;
    chip.title = getCategoryLabel(category).replace(/^\S+\s/, '');
    chip.textContent = CATEGORY_ICONS[normalizedCategory] || '📍';
    filterRow.appendChild(chip);
  });

  filterRow.querySelectorAll('.filter-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      activeFilter = chip.dataset.cat;
      filterRow.querySelectorAll('.filter-chip').forEach(item => item.classList.remove('active'));
      chip.classList.add('active');
      renderPinList();
      updateMarkers();
    });
  });
}

// ─── Popup HTML ───────────────────────────────────────────────────
function buildPopupHtml(pin) {
  const color = CATEGORY_COLORS[pin.category] || CATEGORY_COLORS.general;
  const hasCraftingGrid = String(pin.category).toLowerCase() === 'crafting';
  return `
    <div class="popup-title">${escHtml(pin.name)}</div>
    <div class="popup-cat" style="color:${color}">${getCategoryLabel(pin.category)}</div>
    <div class="popup-coords">X: ${pin.x}  Y: ${pin.y}</div>
    ${pin.notes ? `<div class="popup-notes">${escHtml(pin.notes)}</div>` : ''}
    ${hasCraftingGrid ? `<div class="popup-actions">
      <button class="btn btn-primary btn-sm" onclick="openRecipeGrid(${pin.id})">Recipes</button>
    </div>` : ''}`;
}

function loadRecipeStore() {
  const baseStore = {};

  try {
    const saved = JSON.parse(localStorage.getItem(RECIPES_KEY) || '{}');
    Object.assign(baseStore, saved);
  } catch {
    // ignore invalid saved data
  }

  const staticRecipes = window.GTA_CRAFTING_RECIPES || {};
  Object.keys(staticRecipes).forEach((pinId) => {
    const current = baseStore[pinId];
    if (!Array.isArray(current) || current.length === 0) {
      baseStore[pinId] = staticRecipes[pinId];
    }
  });

  return baseStore;
}

function getRecipesForPin(id) {
  const store = loadRecipeStore();
  const pinId = String(id);
  return store[pinId] || store[id] || window.GTA_CRAFTING_RECIPES?.[pinId] || window.GTA_CRAFTING_RECIPES?.[id] || Array(40).fill('');
}

function renderRecipeDetails(itemName) {
  const recipeGuide = (window.GTA_CRAFTING_RECIPE_GUIDES || {})[itemName];
  const panel = document.getElementById('recipe-detail');
  const title = document.getElementById('recipe-detail-title');
  const summary = document.getElementById('recipe-detail-summary');
  const ingredientList = document.getElementById('recipe-detail-ingredients');
  const stepList = document.getElementById('recipe-detail-steps');

  if (!itemName || !recipeGuide) {
    panel.classList.add('hidden');
    title.textContent = 'Item';
    summary.textContent = 'Select an item to see how it is made.';
    ingredientList.innerHTML = '';
    stepList.innerHTML = '';
    return;
  }

  title.textContent = recipeGuide.title;
  summary.textContent = recipeGuide.summary;
  ingredientList.innerHTML = (recipeGuide.ingredients || []).map(ingredient => `<li>${escHtml(ingredient)}</li>`).join('');
  stepList.innerHTML = (recipeGuide.steps || []).map(step => `<li>${escHtml(step)}</li>`).join('');
  panel.classList.remove('hidden');
}

window.openRecipeGrid = function(id) {
  const pin = pins.find(item => item.id === id);
  if (!pin) return;

  recipePinId = id;
  const recipes = getRecipesForPin(id);
  const grid = document.getElementById('recipe-grid');
  document.getElementById('recipe-title').textContent = `${pin.name} Recipes`;
  grid.innerHTML = '';

  for (let index = 0; index < 40; index++) {
    const cell = document.createElement('button');
    const filledValue = String(recipes[index] ?? '').trim();
    cell.type = 'button';
    cell.className = 'recipe-cell';
    cell.textContent = filledValue || '';
    cell.setAttribute('aria-label', `Recipe slot ${index + 1}`);
    cell.title = filledValue ? `Open recipe: ${filledValue}` : `Recipe slot ${index + 1}`;

    cell.addEventListener('click', () => {
      const itemName = String(cell.textContent || '').trim();
      if (itemName) {
        renderRecipeDetails(itemName);
      }
    });
    grid.appendChild(cell);
  }

  const firstItem = (recipes || []).find(item => String(item || '').trim());
  renderRecipeDetails(firstItem || '');
  document.getElementById('recipe-overlay').classList.add('show');
};

function closeRecipeGrid() {
  recipePinId = null;
  document.getElementById('recipe-overlay').classList.remove('show');
  renderRecipeDetails('');
}

document.getElementById('recipe-save').addEventListener('click', () => {
  if (recipePinId === null) return;
  const recipeStore = loadRecipeStore();
  recipeStore[recipePinId] = [...document.querySelectorAll('.recipe-cell')]
    .map(cell => String(cell.textContent || '').trim());
  localStorage.setItem(RECIPES_KEY, JSON.stringify(recipeStore));
  closeRecipeGrid();
});

document.getElementById('recipe-cancel').addEventListener('click', closeRecipeGrid);
document.getElementById('recipe-overlay').addEventListener('click', (event) => {
  if (event.target === document.getElementById('recipe-overlay')) closeRecipeGrid();
});

// ─── Render a pin on the map ──────────────────────────────────────
function addMarker(pin) {
  const marker = L.marker([pin.y, pin.x], {
    icon: createMarkerIcon(pin.category),
    title: pin.name,
  }).addTo(map);

  marker.bindPopup(buildPopupHtml(pin), { maxWidth: 240 });
  markerMap.set(pin.id, marker);
  return marker;
}

function updateMarkers() {
  markerMap.forEach((marker, pinId) => {
    const pin = pins.find(item => item.id === pinId);
    const visible = pin && (activeFilter === 'all' || normalizeCategory(pin.category) === normalizeCategory(activeFilter));
    marker.setOpacity(visible ? 1 : 0);
  });
}

// ─── Fly to pin ───────────────────────────────────────────────────
function flyToPin(pin) {
  map.flyTo([pin.y, pin.x], Math.max(map.getZoom(), 1), { duration: 0.6 });
  const m = markerMap.get(pin.id);
  if (m) { setTimeout(() => m.openPopup(), 700); }
  highlightedPinId = pin.id;
  renderPinList();
}

// ─── Render pin list ──────────────────────────────────────────────
function renderPinList() {
  const list   = document.getElementById('pin-list');
  const q      = searchQuery.toLowerCase();

  const filtered = pins.filter(p => {
    const matchCat  = activeFilter === 'all' || normalizeCategory(p.category) === normalizeCategory(activeFilter);
    const matchSearch = !q || p.name.toLowerCase().includes(q) ||
                        (p.notes && p.notes.toLowerCase().includes(q));
    return matchCat && matchSearch;
  });

  document.getElementById('pin-count').textContent =
    `${filtered.length} pin${filtered.length !== 1 ? 's' : ''}`;

  if (filtered.length === 0) {
    list.innerHTML = `<div style="text-align:center;color:var(--text-muted);padding:20px;font-size:12px">
      ${pins.length === 0 ? 'No database pins available.' : 'No pins match your filter.'}
    </div>`;
    return;
  }

  list.innerHTML = filtered.map(pin => {
    const color = CATEGORY_COLORS[pin.category] || CATEGORY_COLORS.general;
    const isHL  = pin.id === highlightedPinId;
    return `
      <div class="pin-card ${isHL ? 'highlighted' : ''}" id="pin-${pin.id}">
        <div class="pin-dot" style="background:${color}"></div>
        <div class="pin-card-body" onclick="flyToPin_card(${pin.id})">
          <div class="pin-card-name">${escHtml(pin.name)}</div>
          <div class="pin-card-meta">X: ${pin.x}  Y: ${pin.y} · ${getCategoryLabel(pin.category)}</div>
          ${pin.notes ? `<div class="pin-card-notes">${escHtml(pin.notes)}</div>` : ''}
        </div>
      </div>`;
  }).join('');
}

window.flyToPin_card = function(id) {
  const pin = pins.find(p => p.id === id);
  if (pin) flyToPin(pin);
};

// ─── Search & filter ──────────────────────────────────────────────
document.getElementById('search-input').addEventListener('input', (e) => {
  searchQuery = e.target.value;
  renderPinList();
});

// ─── Utility ──────────────────────────────────────────────────────
function escHtml(str) {
  return String(str)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}

// ─── Boot ─────────────────────────────────────────────────────────
function boot() {
  loadPins();
  pins.forEach(p => addMarker(p));
  updateMarkers();
  renderPinList();
}

boot();
</script>
